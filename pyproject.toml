
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securefl"
version = "0.1.0"
description = "Federated learning backdoor defense using Flower"
dependencies = [
    "flwr[simulation]==1.33.0",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "numpy",
    "matplotlib",
    "pandas",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = [
    "securefl",
    "clients",
    "server",
    "aggregation",
    "detection",
    "datasets",
    "models",
    "attacks",
    "evaluation",
    "graphs",
]

[tool.flwr.app]
publisher = "securefl"

[tool.flwr.app.components]
serverapp = "securefl.server_app:app"
clientapp = "securefl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0
